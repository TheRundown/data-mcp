name: Publish MCP registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified registry publisher
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output /tmp/mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc
      - name: Publish registry manifests
        run: |
          set -euo pipefail
          # The registry rejects re-publishing a version that already exists.
          # This workflow is dispatch-triggered and must stay re-runnable, so an
          # already-published version is a no-op rather than a failure. Every
          # other error still fails the job.
          publish() {
            manifest="$1"
            if output="$(/tmp/mcp-publisher publish "$manifest" 2>&1)"; then
              printf '%s\n' "$output"
              return 0
            fi
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -qF 'cannot publish duplicate version'; then
              echo "::notice::${manifest} is already published at this version; skipping."
              return 0
            fi
            return 1
          }
          publish registry/documentation.server.json
          publish registry/data.server.json
